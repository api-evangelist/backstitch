aid: backstitch
name: backstitch
description: >-
  backstitch is a Techstars-backed Kansas City company that operates an employee
  and total-rewards communications platform (drag-and-drop newsletters, a branded
  mobile employee app, and personalized total-compensation statements) alongside a
  developer-facing content-curation API. The backstitch API lets applications build
  and manage "topics" that aggregate and filter content from social, RSS, video,
  deals, and custom sources, then retrieve normalized result objects (articles,
  statuses, photos, videos, products, services, hotels) or embed them with a
  drop-in JavaScript widget. The API is offered in a legacy v1 and a recommended v2
  over REST/JSON, authenticated with an Organization Key plus per-topic tokens.
